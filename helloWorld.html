<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Exercise 09</title>
    <style>
        .box {
            font-family: "Times New Roman", serif;
            font-weight: bold;
            font-size: 28px;
            padding: 10px 15px;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
        }

        /* 第一個區塊：雙線紅框、淺藍背景 */
        .box1 {
            background-color: lightblue;
            border: 5px double coral; /* 或 red / tomato */
        }

        /* 第二個區塊：實線藍框、黃色背景、圓角 */
        .box2 {
            background-color: yellow;
            border: 3px solid dodgerblue; /* 或 deepskyblue */
            border-radius: 12px;
        }

        /* 第三個區塊：灰點邊框、綠色背景 */
        .box3 {
            background-color: mediumseagreen; /* 或 #3cb371 / green */
            border: 5px dotted gray;
            color: black;
        }
    </style>
</head>
<body>

    <div class="box box1">Hello World</div>
    <div class="box box2">Hello World</div>
    <div class="box box3">Hello World</div>

</body>
</html>
